# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# To configure this workflow:
#
# 1. Configure environment variables
# GitHub sets default environment variables for every workflow run.
# Replace the variables relative to your project in the "env" section below.
#
# 2. Signing
# Generate a signing certificate in the Windows Application
# Packaging Project or add an existing signing certificate to the project.
# Next, use PowerShell to encode the .pfx file using Base64 encoding
# by running the following Powershell script to generate the output string:
#
# $pfx_cert = Get-Content '.\SigningCertificate.pfx' -Encoding Byte
# [System.Convert]::ToBase64String($pfx_cert) | Out-File 'SigningCertificate_Encoded.txt'
#
# Open the output file, SigningCertificate_Encoded.txt, and copy the
# string inside. Then, add the string to the repo as a GitHub secret
# and name it "Base64_Encoded_Pfx."
# For more information on how to configure your signing certificate for
# this workflow, refer to https://github.com/microsoft/github-actions-for-desktop-apps#signing
#
# Finally, add the signing certificate password to the repo as a secret and name it "Pfx_Key".
# See "Build the Windows Application Packaging project" below to see how the secret is used.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: windows-latest

    env:
      Project_Path: PdfTeachAnnotator.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install .NET Core
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore $env:Project_Path

    # Build Release
    - name: Build Release
      run: dotnet build $env:Project_Path -c Release --no-restore

    # Publish application
    - name: Publish application
      run: dotnet publish $env:Project_Path -c Release --no-build -o publish

    # Organize release package
    - name: Organize release package
      shell: pwsh
      run: |
        $sourceDir = "publish"
        $targetDir = "PdfTeachAnnotator-Release"

        New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
        New-Item -ItemType Directory -Path "$targetDir\App" -Force | Out-Null

        # Copy all files to App subfolder
        Copy-Item "$sourceDir\*" -Destination "$targetDir\App\" -Recurse -Force

        # Create shortcut
        $WshShell = New-Object -ComObject WScript.Shell
        $Shortcut = $WshShell.CreateShortcut("$targetDir\PdfTeachAnnotator.lnk")
        $Shortcut.TargetPath = "$targetDir\App\PdfTeachAnnotator.exe"
        $Shortcut.WorkingDirectory = "$targetDir\App"
        $Shortcut.Save()

        Write-Output "Package organized successfully"

    # Create ZIP archive
    - name: Create ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path "PdfTeachAnnotator-Release\*" -DestinationPath "PdfTeachAnnotator-Release.zip" -CompressionLevel Optimal
        $size = (Get-Item "PdfTeachAnnotator-Release.zip").Length / 1MB
        Write-Output "ZIP created: $([math]::Round($size, 2)) MB"

    # Upload build artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PdfTeachAnnotator-Release
        path: PdfTeachAnnotator-Release.zip

    # Create GitHub Release (only on tags)
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: PdfTeachAnnotator-Release.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
