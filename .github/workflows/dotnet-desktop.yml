# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# To configure this workflow:
#
# 1. Configure environment variables
# GitHub sets default environment variables for every workflow run.
# Replace the variables relative to your project in the "env" section below.
#
# 2. Signing
# Generate a signing certificate in the Windows Application
# Packaging Project or add an existing signing certificate to the project.
# Next, use PowerShell to encode the .pfx file using Base64 encoding
# by running the following Powershell script to generate the output string:
#
# $pfx_cert = Get-Content '.\SigningCertificate.pfx' -Encoding Byte
# [System.Convert]::ToBase64String($pfx_cert) | Out-File 'SigningCertificate_Encoded.txt'
#
# Open the output file, SigningCertificate_Encoded.txt, and copy the
# string inside. Then, add the string to the repo as a GitHub secret
# and name it "Base64_Encoded_Pfx."
# For more information on how to configure your signing certificate for
# this workflow, refer to https://github.com/microsoft/github-actions-for-desktop-apps#signing
#
# Finally, add the signing certificate password to the repo as a secret and name it "Pfx_Key".
# See "Build the Windows Application Packaging project" below to see how the secret is used.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: .NET Core Desktop

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: windows-latest

    env:
      Project_Path: PdfTeachAnnotator.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install .NET Core
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore $env:Project_Path

    # Build Release
    - name: Build Release
      run: dotnet build $env:Project_Path -c Release --no-restore

    # Publish application
    - name: Publish application
      run: dotnet publish $env:Project_Path -c Release --no-build -o publish -p:DebugType=None -p:DebugSymbols=false

    # Create root launcher
    - name: Create root launcher
      shell: pwsh
      run: |
        $launcherSrc = "launcher-src"
        $launcherPublish = "launcher-publish"
        New-Item -ItemType Directory -Path $launcherSrc -Force | Out-Null

        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>WinExe</OutputType>
            <TargetFramework>net8.0-windows</TargetFramework>
            <Nullable>enable</Nullable>
            <ImplicitUsings>enable</ImplicitUsings>
            <UseWindowsForms>true</UseWindowsForms>
            <RuntimeIdentifier>win-x64</RuntimeIdentifier>
            <SelfContained>true</SelfContained>
            <PublishSingleFile>true</PublishSingleFile>
            <PublishTrimmed>false</PublishTrimmed>
          </PropertyGroup>
        </Project>
        '@.TrimStart() | Set-Content "$launcherSrc\PdfTeachAnnotator.Launcher.csproj" -Encoding UTF8

        @'
        using System.Diagnostics;
        using System.Windows.Forms;

        var baseDirectory = AppContext.BaseDirectory;
        var appDirectory = Path.Combine(baseDirectory, "App");
        var appPath = Path.Combine(appDirectory, "PdfTeachAnnotator.exe");

        if (!File.Exists(appPath))
        {
            MessageBox.Show(
                $"未找到应用程序文件：{appPath}\n\n请确认发布包已完整解压，且 App 文件夹与本启动器位于同一目录。",
                "PdfTeachAnnotator 启动失败",
                MessageBoxButtons.OK,
                MessageBoxIcon.Error);
            return 1;
        }

        try
        {
            Process.Start(new ProcessStartInfo
            {
                FileName = appPath,
                WorkingDirectory = appDirectory,
                UseShellExecute = true
            });
            return 0;
        }
        catch (Exception ex)
        {
            MessageBox.Show(
                $"启动应用程序失败：{ex.Message}",
                "PdfTeachAnnotator 启动失败",
                MessageBoxButtons.OK,
                MessageBoxIcon.Error);
            return 1;
        }
        '@.TrimStart() | Set-Content "$launcherSrc\Program.cs" -Encoding UTF8

        dotnet publish "$launcherSrc\PdfTeachAnnotator.Launcher.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o $launcherPublish

    # Organize release package
    - name: Organize release package
      shell: pwsh
      run: |
        $sourceDir = "publish"
        $targetDir = "PdfTeachAnnotator-TesseractOnly-win-x64"

        New-Item -ItemType Directory -Path $targetDir -Force | Out-Null
        New-Item -ItemType Directory -Path "$targetDir\App" -Force | Out-Null
        New-Item -ItemType Directory -Path "$targetDir\docs" -Force | Out-Null
        New-Item -ItemType Directory -Path "$targetDir\tools" -Force | Out-Null

        Copy-Item "launcher-publish\PdfTeachAnnotator.Launcher.exe" -Destination "$targetDir\PdfTeachAnnotator.exe" -Force
        Copy-Item "$sourceDir\*" -Destination "$targetDir\App\" -Recurse -Force
        Copy-Item "README.md" -Destination "$targetDir\docs\README.md" -Force
        if (Test-Path "LICENSE") { Copy-Item "LICENSE" -Destination "$targetDir\docs\LICENSE" -Force }
        if (Test-Path "使用说明.txt") { Copy-Item "使用说明.txt" -Destination "$targetDir\docs\使用说明.txt" -Force }
        if (Test-Path "诊断工具.bat") { Copy-Item "诊断工具.bat" -Destination "$targetDir\App\诊断工具.bat" -Force }

        Write-Output "Package organized successfully"

    # Create ZIP archive
    - name: Create ZIP archive
      shell: pwsh
      run: |
        Compress-Archive -Path "PdfTeachAnnotator-TesseractOnly-win-x64\*" -DestinationPath "PdfTeachAnnotator-TesseractOnly-win-x64.zip" -CompressionLevel Optimal
        $size = (Get-Item "PdfTeachAnnotator-TesseractOnly-win-x64.zip").Length / 1MB
        Write-Output "ZIP created: $([math]::Round($size, 2)) MB"

    # Upload build artifacts
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PdfTeachAnnotator-TesseractOnly-win-x64
        path: PdfTeachAnnotator-TesseractOnly-win-x64.zip

    # Create GitHub Release (only on tags)
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: PdfTeachAnnotator-TesseractOnly-win-x64.zip
        body_path: docs/releases/v1.2.0.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
